<svg xmlns='http://www.w3.org/2000/svg' width='560' height='336'> <g fill='#5cff8f' fill-opacity='.2' font-family='Consolas, Menlo, monospace' font-size='13' xml:space='preserve'><text x='18' y='17'>&gt; abrindo o mural...</text><text x='18' y='41'>carregando fichas [##########] 100%</text><text x='18' y='89'>for jogo in backlog:</text><text x='18' y='113'> if jogo.nota &gt;= 9:</text><text x='18' y='137'> pregar(jogo, 'tachinha')</text><text x='18' y='185'>&gt; meu_mural --perfil</text><text x='18' y='209'>OK 6 murais, 0 erros</text><text x='18' y='257'>nota_final = media(fichas)</text><text x='18' y='281'>&gt; zerar --todos</text><text x='18' y='305'>erro: tempo insuficiente</text><text x='18' y='329'>&gt; _</text></g> </svg>