<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!--
    O que esta página pode carregar (Content Security Policy). Se algum dia algo for injetado no meio
    de uma resenha de outra pessoa, o navegador não roda script de fora nem manda dados para outro
    lugar. Ao trocar o endereço da API (public/cloud.json) ou pôr uma busca nova, a lista de
    connect-src muda junto. As capas vêm de qualquer https (dá para colar o link de uma imagem).
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://mural-api.igorsoler.workers.dev https://accounts.google.com/gsi/ https://*.wikipedia.org https://api.rawg.io https://openlibrary.org https://kitsu.io https://kitsu.app https://graphql.anilist.co https://api.themoviedb.org; frame-src https://accounts.google.com/gsi/ https://www.youtube-nocookie.com https://player.vimeo.com; media-src 'self' https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Meu Mural</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Seu mural pessoal de resenhas de jogos, livros, filmes, séries e animes, salvo no seu navegador.">
  <meta name="theme-color" content="#1f1c1a">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Meu Mural">
</head>
<body>
  <app-root></app-root>
</body>
</html>
