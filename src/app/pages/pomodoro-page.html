<h1 class="sr-only" id="pomodoro-titulo" tabindex="-1">Pomodoro</h1>

<div class="bancada">
  <!-- ===== A prateleira: o relógio de pé, os tomatinhos de hoje e as três fitas na frente da tábua ===== -->
  <app-shelf class="tabua">
    <span class="em-pe">
      <app-pomodoro-dial class="grande" [skin]="s().skin" [ms]="left()" [total]="total()" [phase]="phase()" [paused]="paused()" [idle]="!on()" />
      @if (tomatoes().length) {
        <span class="tomatinhos" aria-hidden="true">
          @for (t of tomatoes(); track t) {
            <svg class="tomatinho" viewBox="0 0 24 24" [style.--giro]="(t % 3) - 1">
              <circle cx="12" cy="14" r="8.5" />
              <path class="folha" d="M12 7.5 L7.5 4.5 L11 6.4 L10 2.5 L12.6 5.8 L15.4 2.8 L14 6.6 L17.5 5.2 Z" />
            </svg>
          }
        </span>
      }
      <span class="fitas">
        <button type="button" class="fita" aria-haspopup="dialog" [attr.aria-label]="'Tempo: ' + timeTape() + '. Ajustar'" (click)="sheet.set('tempo')">
          <lucide-icon [img]="ICON.cronometro" [size]="15" aria-hidden="true" />
          <span class="fita-texto">{{ timeTape() }}</span>
        </button>
        <button type="button" class="fita" aria-haspopup="dialog" [attr.aria-label]="'Música: ' + musicTape() + '. Ajustar'" (click)="sheet.set('musica')">
          <lucide-icon [img]="ICON.musica" [size]="15" aria-hidden="true" />
          <span class="fita-texto">{{ musicTape() }}</span>
        </button>
        <button type="button" class="fita" aria-haspopup="dialog" [attr.aria-label]="'Relógio: ' + skinTape() + '. Ajustar'" (click)="sheet.set('relogio')">
          <lucide-icon [img]="ICON.relogio" [size]="15" aria-hidden="true" />
          <span class="fita-texto">{{ skinTape() }}</span>
        </button>
      </span>
    </span>
  </app-shelf>

  <!-- ===== O estado e os botões, numa linha ===== -->
  <div class="acao">
    <p class="estado" role="status">{{ status() }}</p>
    <div class="botoes">
      @if (!on()) {
        <button type="button" class="btn-ink comecar" (click)="startFocus()">
          <lucide-icon [img]="ICON.cronometro" [size]="20" aria-hidden="true" />
          Começar o foco
        </button>
      } @else {
        <button type="button" class="botao-papel" (click)="togglePause()">
          <lucide-icon [img]="paused() ? ICON.estudar : ICON.pausa" [size]="18" aria-hidden="true" />
          {{ paused() ? 'Continuar' : 'Pausar' }}
        </button>
        <button type="button" class="botao-papel" (click)="skip()" [attr.aria-label]="s().phase === 'estudo' ? 'Pular para a pausa' : 'Voltar ao estudo'" [title]="s().phase === 'estudo' ? 'Pular para a pausa' : 'Voltar ao estudo'">
          <lucide-icon [img]="ICON.pular" [size]="18" aria-hidden="true" />
          Pular
        </button>
        <button type="button" class="desligar" (click)="turnOff()" aria-label="Desligar" title="Desligar">
          <lucide-icon [img]="ICON.fechar" [size]="20" aria-hidden="true" />
        </button>
      }
    </div>
  </div>

  <!-- ===== A régua do dia ===== -->
  <app-pomodoro-day class="dia" [runs]="runs()" [now]="clock.now()" [done]="done()" [phase]="runningPhase()" />
</div>

@if (sheet(); as part) {
  <app-pomodoro-sheet [start]="part" (closed)="sheet.set(null)" />
}
