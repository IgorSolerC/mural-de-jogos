<div class="shelf">
  <app-search-strip
    class="search"
    inputId="busca-mural"
    label="Procurar no mural"
    placeholder="Procurar no mural…"
    [value]="view.query()"
    (valueChange)="view.query.set($event)"
  />
  <span class="break" aria-hidden="true"></span>

  <!-- Veredito: abas na tela larga, um seletor só no celular -->
  <div class="group status-tabs" role="group" aria-label="Mostrar">
    <button type="button" class="plate" [attr.aria-pressed]="view.verdict() === 'todos'" (click)="setVerdict('todos')">
      Todos <span class="count">{{ view.verdictCounts().todos }}</span>
    </button>
    @for (v of verdictTabs(); track v) {
      <button type="button" class="plate" [attr.aria-pressed]="view.verdict() === v" (click)="setVerdict(v)">
        {{ labelOf(v) }} <span class="count">{{ view.verdictCounts()[v] }}</span>
      </button>
    }
  </div>

  <label class="plate pick status-pick" [class.is-active]="view.verdict() !== 'todos'">
    <span class="pick-pre">Mostrar</span>
    <span class="pick-val" aria-hidden="true">{{ verdictText() }} <span class="count">{{ view.verdictCounts()[view.verdict()] }}</span></span>
    <lucide-icon class="chev" [img]="ChevronIcon" [size]="16" [strokeWidth]="2.8" aria-hidden="true" />
    <select aria-label="Mostrar" [value]="view.verdict()" (change)="setVerdict($any($event.target).value)">
      <option value="todos" [selected]="view.verdict() === 'todos'">Todos ({{ view.verdictCounts().todos }})</option>
      @for (v of verdictTabs(); track v) {
        <option [value]="v" [selected]="view.verdict() === v">{{ labelOf(v) }} ({{ view.verdictCounts()[v] }})</option>
      }
    </select>
  </label>

  <div class="group order" role="group" aria-label="Ordenar">
    <label class="plate pick">
      <span class="pick-pre">Ordenar</span>
      <span class="pick-val" aria-hidden="true">{{ sortLabel() }}</span>
      <lucide-icon class="chev" [img]="ChevronIcon" [size]="16" [strokeWidth]="2.8" aria-hidden="true" />
      <select aria-label="Ordenar por" [value]="sortValue()" (change)="setSortValue($any($event.target).value)">
        @for (o of sortOptions; track o.value) {
          <option [value]="o.value" [selected]="o.value === sortValue()">{{ o.label }}</option>
        }
        <optgroup label="Nota">
          @for (o of scoreOptions(); track o.value) {
            <option [value]="o.value" [selected]="o.value === sortValue()">{{ o.label }}</option>
          }
        </optgroup>
      </select>
    </label>
    <button
      type="button"
      class="plate icon"
      (click)="flip()"
      [attr.aria-label]="directionLabel() + '. Inverter ordem'"
      [title]="directionLabel()"
    >
      <lucide-icon [img]="view.direction() === 'desc' ? DescIcon : AscIcon" [size]="18" [strokeWidth]="2.6" />
    </button>
  </div>

  <!-- Marcar fichas para ver lado a lado -->
  <button
    type="button"
    class="plate mark"
    [attr.aria-pressed]="side.picking()"
    (click)="side.picking.set(!side.picking())"
    aria-label="Marcar fichas pra ver lado a lado"
    title="Marcar fichas pra ver lado a lado"
  >
    <lucide-icon [img]="MarkIcon" [size]="18" [strokeWidth]="2.6" aria-hidden="true" />
    <span class="mark-word" aria-hidden="true">Marcar</span>
    @if (side.count()) {
      <span class="count" aria-hidden="true">{{ side.count() }}</span>
      <span class="sr-only">({{ side.count() }} marcadas)</span>
    }
  </button>

  <div class="group density" role="group" aria-label="Tipo de ficha">
    <button
      type="button"
      class="plate icon"
      [attr.aria-pressed]="view.density() === 'completa'"
      (click)="setDensity('completa')"
      aria-label="Fichas completas"
      title="Fichas completas"
    >
      <lucide-icon [img]="FullIcon" [size]="18" [strokeWidth]="2.6" aria-hidden="true" />
    </button>
    <button
      type="button"
      class="plate icon"
      [attr.aria-pressed]="view.density() === 'simples'"
      (click)="setDensity('simples')"
      aria-label="Fichas simples"
      title="Fichas simples"
    >
      <lucide-icon [img]="CompactIcon" [size]="18" [strokeWidth]="2.6" aria-hidden="true" />
    </button>
    <button
      type="button"
      class="plate icon"
      [attr.aria-pressed]="view.density() === 'capas'"
      (click)="setDensity('capas')"
      aria-label="Só capa e nome"
      title="Só capa e nome"
    >
      <lucide-icon [img]="CoversIcon" [size]="18" [strokeWidth]="2.6" aria-hidden="true" />
    </button>
  </div>
</div>
