<a class="skip" href="#conteudo">Pular para o conteúdo</a>

<header class="top">
  <a class="cartaz cartolina" routerLink="/" aria-label="Meu mural de jogos, início">
    <app-pin class="pin pin-l" color="#e62e2d" />
    <app-pin class="pin pin-r" color="#2f6bff" />
    <span class="logo" aria-hidden="true">Meu mural <span class="nl">de <span class="scribble">jogos</span></span></span>
  </a>

  <nav class="tabs" aria-label="Seções">
    @for (t of tabs; track t.path) {
      <a
        class="tab cartolina"
        [routerLink]="t.path"
        routerLinkActive="on"
        [routerLinkActiveOptions]="{ exact: t.exact }"
        ariaCurrentWhenActive="page"
        [style.--stock]="'var(--stock-' + t.stock + ')'"
      >
        <app-pin class="tab-pin" color="#e62e2d" />
        <span>{{ t.label }}</span>
        @if (tabCount(t.path); as n) {
          <span class="n">{{ n }}</span>
        }
      </a>
    }
  </nav>

  <span class="stack">
    <button type="button" class="btn-cartolina" (click)="newReview()" aria-keyshortcuts="n" aria-label="Pregar resenha">
      <lucide-icon [img]="PlusIcon" [size]="22" [strokeWidth]="3" aria-hidden="true" />
      Pregar<span class="long">&nbsp;resenha</span>
    </button>
  </span>
</header>

@if (store.saveError(); as err) {
  <p class="save-error" role="alert">
    {{ err }} <a routerLink="/ajustes">Baixar backup</a>
  </p>
}

<main id="conteudo" tabindex="-1">
  <router-outlet />
</main>

<app-review-editor (saved)="onSaved($event)" (drafted)="onDrafted($event)" (draftRemoved)="removeDraft($event)" />
<app-review-reader (edit)="editReview($event)" (remove)="removeReview($event)" />
<app-toast />
