name: API do cofre (testes)

# Testa a API do cofre em todo push e pull request que mexe em cofre-api/ ou no núcleo da página do
# cofre (projects/cofre/src/core), que o teste da página e da API juntas usa (test/pagina.suite.ts). Só
# testa: a publicação do cofre é outro workflow, só à mão e com a aprovação do usuário (PLANO-COFRE.md,
# seção 11, Fase 3).
on:
  push:
    branches: [main]
    paths: ['cofre-api/**', 'projects/cofre/src/core/**', '.github/workflows/cofre-api.yml']
  pull_request:
    paths: ['cofre-api/**', 'projects/cofre/src/core/**', '.github/workflows/cofre-api.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: cofre-api

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cofre-api/package-lock.json
      # a raiz também: o núcleo da página importa o hash-wasm de lá
      - name: Instala a raiz
        working-directory: .
        run: npm ci
      - run: npm ci
      - run: npm run typecheck
      # A mesma suíte no SQLite do Node e no simulador do D1.
      - run: npm test
