name: Backup da nuvem

# Todo dia, uma cópia do banco inteiro da nuvem (o D1) fica guardada fora da Cloudflare: num artefato
# desta execução, em Actions, por 30 dias. A Cloudflare só volta o banco até 7 dias no plano gratuito;
# esta cópia cobre o resto, e também o caso de algo acontecer com a conta da Cloudflare.
#
# O repositório é público, e qualquer pessoa com conta no GitHub baixa artefatos de um repositório
# público. Por isso o backup sai compactado e TRANCADO com uma senha (AES-256): sem o secret
# BACKUP_SENHA a execução falha antes de exportar, e nunca sobe um arquivo aberto.
#
# Secrets: BACKUP_SENHA (guarde também fora do GitHub: sem ela o backup não abre), e os do deploy,
# CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID. Como abrir e restaurar: api/README.md, "Backup diário".
# Execuções agendadas só rodam a partir da main. Se falhar, o GitHub manda e-mail.
#
# O job "cofre" faz o mesmo com o banco do cofre de senhas (o D1 cofre, do cofre-api), num arquivo
# próprio; ele só roda com a variável COFRE_NO_AR = sim. Como voltar: cofre-api/README.md.
#
# O job "imagens" faz o mesmo com o banco dos bytes das imagens coladas (o D1 mural-imagens,
# PLANO-IMAGENS.md), uma vez por semana (domingo) e quando quiser: ele é grande e muda pouco, e o Time
# Travel da Cloudflare cobre os últimos 7 dias. Os dados de cada imagem estão no backup diário do mural.
on:
  schedule:
    # 06:31 UTC (03h31 em Brasília): depois das limpezas diárias (a do Murall às 06:17 UTC, a do cofre
    # às 06:23) e fora do horário de uso.
    # A exportação trava o banco enquanto roda; com o tamanho dele, são segundos.
    - cron: '31 6 * * *'
    # domingo, 06:41 UTC: só o banco das imagens (o diário não roda de novo nessa hora)
    - cron: '41 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-nuvem
  cancel-in-progress: false

jobs:
  backup:
    if: github.event.schedule != '41 6 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    # Os secrets só nos passos que os usam, nunca no job: o `npm ci` não vê nem o token nem a senha
    # (nem o GITHUB_TOKEN: o checkout não o deixa no .git/config).
    steps:
      - name: Confere a senha antes de tudo
        # roda antes do checkout: a pasta api ainda não existe, e o passo falhava ao começar
        working-directory: .
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          if [ -z "$BACKUP_SENHA" ]; then
            echo "::error::Falta o secret BACKUP_SENHA (Settings › Secrets and variables › Actions). Sem ele o backup não é feito, para nunca subir o banco aberto."
            exit 1
          fi
          if [ "${#BACKUP_SENHA}" -lt 16 ]; then
            echo "::error::A BACKUP_SENHA precisa ter pelo menos 16 caracteres."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # sem o GITHUB_TOKEN guardado no .git/config: o npm ci (e os scripts das dependências) não o leem
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Exporta o banco
        run: npx wrangler d1 export mural --remote --output=backup-mural.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confere o que veio
        run: bash scripts/backup.sh conferir backup-mural.sql
      - name: Compacta e tranca
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          DIA=$(date -u +%F)
          bash scripts/backup.sh trancar backup-mural.sql "backup-mural-$DIA.sql.gz.enc"
          rm -f backup-mural.sql
          echo "ARQUIVO=backup-mural-$DIA.sql.gz.enc" >> "$GITHUB_ENV"
          echo "DIA=$DIA" >> "$GITHUB_ENV"
      - name: Confere que abre com a senha (e que o que abre é o banco inteiro)
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          bash scripts/backup.sh abrir "$ARQUIVO" > volta.sql
          bash scripts/backup.sh conferir volta.sql
          rm -f volta.sql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-mural-${{ env.DIA }}
          path: api/${{ env.ARQUIVO }}
          retention-days: 30
          if-no-files-found: error
          # já está compactado (e trancado): compactar de novo não ganha nada
          compression-level: 0
      - name: Resumo
        run: |
          {
            echo "### Backup de $DIA"
            echo ""
            echo "Arquivo trancado: \`$ARQUIVO\` ($(du -h "$ARQUIVO" | cut -f1)), guardado por 30 dias nos artefatos desta execução."
            echo "Para abrir: \`bash api/scripts/backup.sh abrir $ARQUIVO > mural.sql\` (com a BACKUP_SENHA no ambiente)."
          } >> "$GITHUB_STEP_SUMMARY"

  # O banco do cofre de senhas (PLANO-COFRE.md, 16.3), num arquivo próprio, com a mesma senha. O que
  # está dentro já é cifrado no aparelho; trancar o backup é uma segunda camada. Só roda depois de o
  # cofre ir ao ar (a variável COFRE_NO_AR = sim, a mesma do vigia).
  cofre:
    if: vars.COFRE_NO_AR == 'sim' && github.event.schedule != '41 6 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cofre-api
    env:
      # as tabelas das migrações do cofre (cofre-api/test/backup.test.ts confere a lista)
      BACKUP_TABELAS: cofre_contas cofre_credenciais cofre_envelopes cofre_itens cofre_sessoes cofre_desafios cofre_eventos cofre_freio_senha freios uso_diario
    # os secrets só nos passos que os usam, como no job de cima
    steps:
      - name: Confere a senha antes de tudo
        working-directory: .
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          if [ -z "$BACKUP_SENHA" ] || [ "${#BACKUP_SENHA}" -lt 16 ]; then
            echo "::error::Falta o secret BACKUP_SENHA (pelo menos 16 caracteres). Sem ele o backup não é feito, para nunca subir o banco aberto."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # sem o GITHUB_TOKEN guardado no .git/config: o npm ci (e os scripts das dependências) não o leem
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cofre-api/package-lock.json
      - run: npm ci
      - name: Exporta o banco do cofre
        run: npx wrangler d1 export cofre --remote --output=backup-cofre.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confere o que veio
        run: bash ../api/scripts/backup.sh conferir backup-cofre.sql
      - name: Compacta e tranca
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          DIA=$(date -u +%F)
          bash ../api/scripts/backup.sh trancar backup-cofre.sql "backup-cofre-$DIA.sql.gz.enc"
          rm -f backup-cofre.sql
          echo "ARQUIVO=backup-cofre-$DIA.sql.gz.enc" >> "$GITHUB_ENV"
          echo "DIA=$DIA" >> "$GITHUB_ENV"
      - name: Confere que abre com a senha (e que o que abre é o banco inteiro)
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          bash ../api/scripts/backup.sh abrir "$ARQUIVO" > volta.sql
          bash ../api/scripts/backup.sh conferir volta.sql
          rm -f volta.sql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-cofre-${{ env.DIA }}
          path: cofre-api/${{ env.ARQUIVO }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Resumo
        run: |
          {
            echo "### Backup do cofre de $DIA"
            echo ""
            echo "Arquivo trancado: \`$ARQUIVO\` ($(du -h "$ARQUIVO" | cut -f1)), guardado por 30 dias nos artefatos desta execução."
            echo "Para abrir: \`bash api/scripts/backup.sh abrir $ARQUIVO > cofre.sql\` (com a BACKUP_SENHA no ambiente)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Os bytes das imagens coladas (o D1 mural-imagens), toda semana, num arquivo próprio, com a mesma
  # senha. Pode estar vazio de verdade (nenhuma imagem ainda): o "conferir" só exige a tabela.
  imagens:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 6 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    env:
      BACKUP_TABELAS: bytes
    # os secrets só nos passos que os usam, como no job do mural
    steps:
      - name: Confere a senha antes de tudo
        working-directory: .
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          if [ -z "$BACKUP_SENHA" ] || [ "${#BACKUP_SENHA}" -lt 16 ]; then
            echo "::error::Falta o secret BACKUP_SENHA (pelo menos 16 caracteres). Sem ele o backup não é feito, para nunca subir o banco aberto."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # sem o GITHUB_TOKEN guardado no .git/config: o npm ci (e os scripts das dependências) não o leem
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Exporta o banco das imagens
        run: npx wrangler d1 export mural-imagens --remote --output=backup-mural-imagens.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confere o que veio
        run: bash scripts/backup.sh conferir backup-mural-imagens.sql
      - name: Compacta e tranca
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          DIA=$(date -u +%F)
          bash scripts/backup.sh trancar backup-mural-imagens.sql "backup-mural-imagens-$DIA.sql.gz.enc"
          rm -f backup-mural-imagens.sql
          echo "ARQUIVO=backup-mural-imagens-$DIA.sql.gz.enc" >> "$GITHUB_ENV"
          echo "DIA=$DIA" >> "$GITHUB_ENV"
      - name: Confere que abre com a senha (e que o que abre é o banco inteiro)
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          bash scripts/backup.sh abrir "$ARQUIVO" > volta.sql
          bash scripts/backup.sh conferir volta.sql
          rm -f volta.sql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-mural-imagens-${{ env.DIA }}
          path: api/${{ env.ARQUIVO }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Resumo
        run: |
          {
            echo "### Backup das imagens de $DIA"
            echo ""
            echo "Arquivo trancado: \`$ARQUIVO\` ($(du -h "$ARQUIVO" | cut -f1)), guardado por 30 dias nos artefatos desta execução."
            echo "Para abrir: \`bash api/scripts/backup.sh abrir $ARQUIVO > mural-imagens.sql\` (com a BACKUP_SENHA no ambiente)."
          } >> "$GITHUB_STEP_SUMMARY"
