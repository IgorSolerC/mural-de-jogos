name: API (Cloudflare)

# Testa a API em todo push e pull request que mexe em api/, e publica no Cloudflare Workers.
# Enquanto a nuvem não estiver ligada no site, a branch `nuvem` também publica (o site não chama a
# API antes disso). Depois do merge na main, tirar `nuvem` da lista de branches.
on:
  push:
    branches: [main, nuvem]
    paths: ['api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # A mesma suíte no SQLite do Node e no simulador do D1.
      - run: npm test

  publicar:
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Nunca dois deploys ao mesmo tempo (e nunca cancelar um no meio das migrações).
    concurrency:
      group: api-publicar
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Aplica as migrações no D1
        run: npx wrangler d1 migrations apply mural --remote
      - name: Publica o Worker
        run: npx wrangler deploy
      - name: Confere se a API responde
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors https://mural-api.igorsoler.workers.dev/v1/status
