name: API (Cloudflare)

# Testa a API em todo push e pull request que mexe em api/, e publica no Cloudflare Workers.
on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # A mesma suíte no SQLite do Node e no simulador do D1.
      - run: npm test

  publicar:
    needs: testes
    # só a main publica (rodar à mão em outro ramo só testa)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Nunca dois deploys ao mesmo tempo (e nunca cancelar um no meio das migrações).
    concurrency:
      group: api-publicar
      cancel-in-progress: false
    # O token da Cloudflare só nos passos do wrangler, nunca no job: o `npm ci` (e qualquer script de
    # instalação de um pacote) não o vê. Ele alcança a conta toda, inclusive o cofre (PLANO-COFRE.md 17.5).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Aplica as migrações no D1
        run: npx wrangler d1 migrations apply mural --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publica o Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confere se a API responde
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors https://mural-api.igorsoler.workers.dev/v1/status
